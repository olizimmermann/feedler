[project]
name = "feedler"
version = "0.1.0"
description = "Self-hosted Reddit and RSS reader that uses an LLM to keep only the posts you care about"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "olizimmermann" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "apscheduler>=3.10,<4",
    "anthropic>=0.60",
    "openai>=1.40",
    "google-genai>=1.0",
]

[project.urls]
Homepage = "https://github.com/olizimmermann/feedler"
Issues = "https://github.com/olizimmermann/feedler/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
