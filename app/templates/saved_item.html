{% extends "base.html" %}
{% block title %}{{ s.title }} · Feedler{% endblock %}
{% block content %}
<p><a href="/saved">← Saved</a></p>
<article class="panel reader">
  <h1>{{ s.title }}</h1>
  <p class="muted small"><a href="{{ s.url }}" target="_blank" rel="noopener">{{ s.url }}</a> · saved {{ s.created_at.strftime('%Y-%m-%d') }}</p>
  {% if s.note %}<p class="summary">{{ s.note }}</p>{% endif %}
  <div class="prose">{{ s.archived_text or 'No archived text.' }}</div>
</article>
{% endblock %}
