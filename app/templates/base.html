<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf }}">
  <title>{% block title %}Feedler{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
  {% if user %}<link rel="alternate" type="application/atom+xml" title="Feedler" href="/u/{{ user.feed_token }}/feed.xml">{% endif %}
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf }}"}'>
  {% if user %}
  <header class="topbar">
    <a class="brand" href="/">feedler</a>
    <nav>
      <a href="/" class="{{ 'active' if request.url.path == '/' }}">Feed</a>
      <a href="/saved" class="{{ 'active' if request.url.path.startswith('/saved') }}">Saved</a>
      <a href="/settings/sources" class="{{ 'active' if request.url.path.startswith('/settings') }}">Settings</a>
      {% if user.is_admin %}<a href="/admin" class="{{ 'active' if request.url.path.startswith('/admin') }}">Admin</a>{% endif %}
    </nav>
    <form method="post" action="/logout" class="logout">
      <input type="hidden" name="csrf_token" value="{{ csrf }}">
      <button class="link" title="{{ user.email }}">Log out</button>
    </form>
  </header>
  {% endif %}
  <main class="{% block main_class %}container{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <div id="kbd-help" class="kbd-help" hidden>
    <b>Keyboard</b>
    <span><kbd>j</kbd>/<kbd>k</kbd> next / previous</span>
    <span><kbd>u</kbd>/<kbd>d</kbd> vote up / down</span>
    <span><kbd>s</kbd> save</span>
    <span><kbd>o</kbd> open link</span>
    <span><kbd>x</kbd> hide</span>
    <span><kbd>?</kbd> toggle this help</span>
  </div>
</body>
</html>
