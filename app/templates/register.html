{% extends "base.html" %}
{% block title %}Create account · Feedler{% endblock %}
{% block main_class %}auth{% endblock %}
{% block content %}
<div class="auth-card">
  <h1 class="brand big">feedler</h1>
  <p class="muted">Create an account. The first account becomes the admin.</p>
  {% if error %}<p class="flash error">{{ error }}</p>{% endif %}
  <form method="post" action="/register" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <label>Email <input type="email" name="email" value="{{ email or '' }}" required autofocus></label>
    <label>Password <input type="password" name="password" minlength="8" required></label>
    <button class="primary">Create account</button>
  </form>
  <p class="muted small">Already registered? <a href="/login">Log in</a></p>
</div>
{% endblock %}
